<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="keywords" content="">
    <meta name="description" content="">
    <link rel="shortcut icon" type="image/png">

    <title>广告商后台</title>

    <!--responsive table-->
    <link href="/css/table-responsive.css" rel="stylesheet"/>

    <!--common-->
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/style-responsive.css" rel="stylesheet">

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
    <script src="/js/html5shiv.js"></script>
    <script src="/js/respond.min.js"></script>
    <![endif]-->
</head>
<body class="sticky-header">

<section>
    <div th:replace="component/left_nav::left-nav('financial')"></div>

    <!-- main content start-->
    <div class="main-content">
        <div th:replace="component/header::header"></div>

        <!--body wrapper start-->
        <div class="wrapper">
            <div class="row">
                <div class="col-sm-12">
                    <section class="panel">
                        <header class="panel-heading">财务报表</header>
                        <div class="panel-body">
                            <section id="unseen">
                                <table class="table table-hover general-table" id="logList">
                                    <thead>
                                    <tr>
                                        <th>充值日期</th>
                                        <th>充值金额</th>
                                        <th>操作</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="log : ${logs}">
                                        <td th:text="${log.date}"></td>
                                        <td th:include="util/currency::format(${log.amount})"></td>
                                        <td>
                                            <Button class="btn btn-primary" th:onclick="'downloadFile(\'' + ${log.file} + '\')'">下载</Button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </section>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <!--body wrapper end-->

        <div th:replace="component/footer::footer"></div>
    </div>
    <!-- main content end-->

</section>

<!-- Placed js at the end of the document so the pages load faster -->
<script src="/js/jquery-1.10.2.min.js"></script>
<script src="/js/jquery-ui-1.9.2.custom.min.js"></script>
<script src="/js/jquery-migrate-1.2.1.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/js/modernizr.min.js"></script>
<script src="/js/jquery.nicescroll.js"></script>

<!--data table-->
<script type="text/javascript" src="/js/data-tables/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="/js/data-tables/DT_bootstrap.js"></script>
<script src="/js/dynamic_table_init.js"></script>

<!--common scripts for all pages-->
<script src="/js/scripts.js"></script>

<script>
    function downloadFile(fileUrl) {

        // 要保存的文件名
        const extension = getFileExtension(fileUrl);
        const fileName = '充值记录.' + extension;

        // 创建一个链接
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = fileName;

        // 模拟点击链接以触发下载
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function getFileExtension(url) {
        // 使用正则表达式从URL中提取文件名和后缀
        const match = url.match(/\.([a-zA-Z0-9]+)(?:\?.*)?$/);

        // 如果匹配成功，返回后缀；否则，返回空字符串
        return match ? match[1] : '';
    }
</script>

</body>
</html>
