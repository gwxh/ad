<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="shortcut icon" type="image/png">

    <title>登录</title>

    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/style-responsive.css" rel="stylesheet">

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
    <script src="/js/html5shiv.js"></script>
    <script src="/js/respond.min.js"></script>
    <![endif]-->
    <style>
        .logoimg{
            background-color: #FFFFFF;
        }
    </style>
</head>

<body class="login-body">
<header class="login_header">
    <div class="logoimg">
        <img src="/images/logo.jpg" style="margin: 10px;height: 80px;">
    </div>
</header>

<div class="container">

    <form th:action="@{/user/login}"  th:method="post" class="form-signin">
        <div class="form-signin-heading text-center">
            <h1 class="sign-title">广告商登录</h1>
        </div>
        <div class="login-wrap">
            <p th:if="${msg!=null}" th:text="|${msg}!|" style="color:#FF6C60;">登录错误</p>
            <input id="username" name="username" type="text" class="form-control" placeholder="请输入用户名" autofocus>
            <input id="password" name="password" type="password" class="form-control" placeholder="请输入密码">

            <button class="btn btn-lg btn-login btn-block" type="submit">
                <i class="fa fa-check"></i>
            </button>
        </div>
    </form>
</div>
<div>
    <img src="/images/bg1.jpeg" style="width:100%;">
    <img src="/images/bg2.jpeg" style="width:100%;">
    <img src="/images/bg3.jpeg" style="width:100%;">
    <img src="/images/bg4.jpeg" style="width:100%;">
    <img src="/images/bg5.jpeg" style="width:100%;">
</div>

</body>
</html>
