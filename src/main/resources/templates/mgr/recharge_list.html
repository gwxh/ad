<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理后台</title>
    <meta content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no' name='viewport'>
    <link href="/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <link href="/fonts/css/font-awesome.min.css" rel="stylesheet" type="text/css"/>
    <link href="/css/mgr/ionicons.min.css" rel="stylesheet" type="text/css"/>
    <link href="/css/mgr/AdminLTE.css" rel="stylesheet" type="text/css"/>

    <!--data table-->
    <link rel="stylesheet" href="/js/data-tables/DT_bootstrap.css"/>

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="/js/html5shiv.js"></script>
    <script src="/js/respond.min.js"></script>
    <![endif]-->
</head>
<body class="skin-blue">

<div th:replace="mgr/component/header::header"></div>

<div class="wrapper row-offcanvas row-offcanvas-left">
    <div th:replace="mgr/component/left_nav::left-nav('rechargeList')"></div>

    <!-- Right side column. Contains the navbar and content of the page -->
    <aside class="right-side">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>充值记录</h1>
        </section>

        <!-- Main content -->
        <section class="content">
            <div class="row">
                <div class="col-xs-12">
                    <div class="box">
                        <div class="box-body">
                            <table class="table table-hover general-table" id="userList">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>充值日期</th>
                                    <th>充值用户</th>
                                    <th>充值金额</th>
                                    <th>备注</th>
                                    <th>文件</th>
                                    <th>操作</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="log : ${logs}">
                                    <td th:text="${log.id}"></td>
                                    <td th:text="${log.date}"></td>
                                    <td th:text="${log.username}"></td>
                                    <td th:include="util/currency::format(${log.amount})"></td>
                                    <td th:text="${log.note}"></td>
                                    <td th:text="${log.file}"></td>
                                    <td>
                                        <a style="cursor: pointer;"
                                           data-toggle="modal" data-target="#rechargeModal"
                                           th:onclick="'javascript:setId('+${log.id}+')' ">上传</a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section><!-- /.content -->
    </aside><!-- /.right-side -->
</div><!-- ./wrapper -->

<div class="modal fade" id="rechargeModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    &times;
                </button>
                <h4 class="modal-title">
                    上传充值文件
                </h4>
            </div>
            <form id="rechargeForm" th:action="@{/mgr/uploadRechargeFile}"
                  th:method="post" role="form" enctype="multipart/form-data">
                <input id="logId" name="id" type="hidden"/>
                <div class="modal-body">
                    <div class="box-body">
                        <div class="form-group">
                            <label>上传文件</label>
                            <input type="file" name="file"/>
                        </div>
                    </div><!-- /.box-body -->
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">上传</button>
                </div>
            </form>
        </div><!-- /.modal-content -->
    </div><!-- /.modal -->
</div>

<script src="/js/mgr/jquery-1.10.2.min.js"></script>
<script src="/js/mgr/bootstrap.min.js"></script>
<script src="/js/mgr/app.js" type="text/javascript"></script>

<!--data table-->
<script type="text/javascript" src="/js/data-tables/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="/js/data-tables/DT_bootstrap.js"></script>
<script src="/js/data-tables/dynamic_table_init.js"></script>

<!--form-->
<script src="/js/jquery.validate.min.js"></script>
<script src="/js/messages_zh.min.js"></script>
<script src="/js/form.js"></script>
<script th:replace="component/msg::msg"></script>

<script>
    function setId(id) {
        $("#logId").val(id)
    }
</script>
</body>
</html>
