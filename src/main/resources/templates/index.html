<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="keywords" content="">
    <meta name="description" content="">
    <link rel="shortcut icon" type="image/png">

    <title>广告商后台</title>

    <!--common-->
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/style-responsive.css" rel="stylesheet">

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
    <script src="/js/html5shiv.js"></script>
    <script src="/js/respond.min.js"></script>
    <![endif]-->
    <style>
        table {
            width: 92%;
            margin: auto;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body class="sticky-header">

<section>
    <div th:replace="component/left_nav::left-nav('user')"></div>

    <!-- main content start-->
    <div class="main-content">
        <div th:replace="component/header::header"></div>

        <!-- page heading start-->
        <div class="page-heading">
            <div class="row state-info">
                <div class="col-sm-3">
                    <section class="panel">
                        <div class="panel-body">
                            <div class="summary">
                                <span>账户余额</span>
                                <h3 class="red-txt">
                                    <span th:replace="util/currency::format(${userAmount})"></span>
                                </h3>
                            </div>
                        </div>
                    </section>
                </div>
                <div class="col-sm-3">
                    <section class="panel">
                        <div class="panel-body">
                            <div class="summary">
                                <span>当日支付</span>
                                <h3 class="green-txt">
                                    <span th:replace="util/currency::format(${todayConsumeAmount})"></span>
                                </h3>
                            </div>
                        </div>
                    </section>
                </div>
                <div class="col-sm-3">
                    <section class="panel">
                        <div class="panel-body">
                            <div class="summary">
                                <span>昨日支付</span>
                                <h3 class="green-txt">
                                    <span th:replace="util/currency::format(${yesterdayConsumeAmount})"></span>
                                </h3>
                            </div>
                        </div>
                    </section>
                </div>
                <div class="col-sm-3">
                    <section class="panel">
                        <div class="panel-body">
                            <div class="summary">
                                <span>当月支付</span>
                                <h3 class="green-txt">
                                    <span th:replace="util/currency::format(${monthConsumeAmount})"></span>
                                </h3>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <!-- page heading end-->

        <!--body wrapper start-->
        <div class="wrapper">
            <div class="row">
                <div class="col-sm-12">
                    <section class="panel">
                        <header class="panel-heading">
                            数据报告
<!--                            <span class="tools pull-right">-->
<!--                                <a href="">更多数据</a>-->
<!--                            </span>-->
                        </header>
                        <div class="panel-body">
                            <input id="logJson" type="hidden" th:value="${logJson}">
                            <div class="chart">
                                <div id="container"></div>
                                <div id="container2" style="margin-top: 50px;margin-bottom: 80px;"></div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <!--body wrapper end-->

        <!--body wrapper start-->
        <div class="wrapper">
            <div class="row">
                <div class="col-sm-12">
                    <section class="panel">
                        <header class="panel-heading">
                            平台流量
                        </header>
                        <div class="panel-body">
                            <input id="platformPVJson" type="hidden" th:value="${platformPVJson}">
                            <div class="chart">
                                <div id="platformPVContainer"></div>
                            </div>

                            <table id="data-table">
                                <!-- Rows will be inserted here by JavaScript -->
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <!--body wrapper end-->

        <div th:replace="component/footer::footer"></div>
    </div>
    <!-- main content end-->

</section>

<!-- Placed js at the end of the document so the pages load faster -->
<script src="/js/jquery-1.10.2.min.js"></script>
<script src="/js/jquery-ui-1.9.2.custom.min.js"></script>
<script src="/js/jquery-migrate-1.2.1.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/js/modernizr.min.js"></script>
<script src="/js/jquery.nicescroll.js"></script>

<!--common scripts for all pages-->
<script src="/js/scripts.js"></script>

<script src="/js/highcharts.js"></script>

<script>
    $(function () {
        var logJson = $("#logJson").val();
        var log = JSON.parse(logJson);
        var xArray = [];
        var execArray = [];
        var cpcArray = [];
        for (var i in log) {
            xArray.push(toDate(log[i].recordTime));
            execArray.push(log[i].exec);
            cpcArray.push(log[i].cpc);
        }
        Highcharts.chart('container', {
            chart:{
                borderWidth: 1,
                borderColor: 'black',
            },
            title: {
                text: '近30天曝光量'
            },
            xAxis: {
                categories: xArray
            },
            yAxis: {
                title: {
                    text: ''
                }
            },
            tooltip: {
                crosshairs: true,
                shared: true
            },
            plotOptions: {
                spline: {
                    marker: {
                        radius: 4,
                        lineColor: '#666666',
                        lineWidth: 1
                    }
                }
            },
            series: [{
                name: '曝光量',
                data: execArray,
                color: '#ff6f00',
            }]
        });
        Highcharts.chart('container2', {
            chart:{
                type: 'column',
                borderWidth: 1,
                borderColor: 'black',
            },
            title: {
                text: '近30天点击量'
            },
            xAxis: {
                categories: xArray
            },
            yAxis: {
                title: {
                    text: ''
                }
            },
            tooltip: {
                crosshairs: true,
                shared: true
            },
            plotOptions: {
                spline: {
                    marker: {
                        radius: 4,
                        lineColor: '#666666',
                        lineWidth: 1
                    }
                }
            },
            series: [{
                name: '点击量',
                data: cpcArray,
                color: '#82bcea',
            }]
        });
        var platformPVJson =$("#platformPVJson").val();
        var platformPV = JSON.parse(platformPVJson);
        var itemArray = [];
        var pvArray = [];
        var rateArray = [];

        const table = document.getElementById('data-table');
        // Create table headers
        const headerRow = document.createElement('tr');
        const th = document.createElement('th');
        th.textContent = "类目";
        headerRow.appendChild(th);

        // Create table rows
        const row1 = document.createElement('tr');
        const cell1 = document.createElement('td');
        cell1.textContent = "流量/万人次";
        row1.appendChild(cell1);
        const row2 = document.createElement('tr');
        const cell2 = document.createElement('td');
        cell2.textContent = "占比";
        row2.appendChild(cell2);

        for (var i in platformPV) {
            const th = document.createElement('th');
            th.textContent = platformPV[i].name;
            headerRow.appendChild(th);
            const pvCell = document.createElement('td');
            pvCell.textContent = platformPV[i].pv;
            row1.appendChild(pvCell);
            const rateCell = document.createElement('td');
            rateCell.textContent = platformPV[i].rate+'%';
            row2.appendChild(rateCell);

            var itemName = platformPV[i].name;
            itemArray.push(itemName);
            pvArray.push(platformPV[i].pv);
            rateArray.push(platformPV[i].rate);
        }
        table.appendChild(headerRow);
        table.appendChild(row1);
        table.appendChild(row2);

        Highcharts.chart('platformPVContainer', {
            chart: {
                zoomType: 'xy'
            },
            title: {
                text: '平台流量及占比'
            },
            xAxis: [{
                categories: itemArray,
            }],
            yAxis: [{ // Primary yAxis
                labels: {
                    format: '{value}',
                    style: {
                        color: Highcharts.getOptions().colors[1]
                    }
                },
                title: {
                    text: '流量/万人次',
                    style: {
                        color: Highcharts.getOptions().colors[1]
                    }
                }
            }, { // Secondary yAxis
                title: {
                    text: '占比',
                    style: {
                        color: Highcharts.getOptions().colors[0]
                    }
                },
                labels: {
                    format: '{value}%',
                    style: {
                        color: Highcharts.getOptions().colors[0]
                    }
                },
                opposite: true
            }],
            tooltip: {
                shared: true
            },
            legend: {
                layout: 'vertical',
                align: 'left',
                x: 120,
                verticalAlign: 'top',
                y: 100,
                floating: true,
                backgroundColor: (Highcharts.theme && Highcharts.theme.legendBackgroundColor) || '#FFFFFF'
            },
            series: [{
                name: '占比',
                type: 'column',
                yAxis: 1,
                data: rateArray,
                tooltip: {
                    valueSuffix: '%'
                },
                color: '#82bcea',
            }, {
                name: '流量/万人次',
                type: 'spline',
                data: pvArray,
                color: '#e10c0c',
            }]
        });
    });

    function toDate(timestamp) {
        var date = new Date(timestamp * 1000);
        var Y = date.getFullYear() + '-';
        var M = (date.getMonth() + 1 < 10 ? '0' + (date.getMonth() + 1) : date.getMonth() + 1) + '-';
        var D = date.getDate();
        return Y + M + D;
    }
</script>

</body>
</html>
